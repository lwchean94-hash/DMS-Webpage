<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hartalega Foresight - DMS Health</title>
<link rel="icon" type="image/png" href="Hartalega_Foresight_Logo.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    zoom: 80%;
    background: #0a1628;
    overflow-x: hidden;
  }
  .dms-page {
    font-family: 'Inter', sans-serif;
    background: #0a1628;
    min-height: 100vh;
    color: #e8eaf0;
    position: relative;
    overflow-x: hidden;
  }

  .dms-gridbg {
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(34,197,94,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(34,197,94,0.03) 1px, transparent 1px),
      radial-gradient(circle at center, rgba(10,22,40,0.85) 0%, rgba(10,22,40,0.65) 100%),
      url('Foresight_Background.jpg'); 
    background-size: 48px 48px, 48px 48px, cover, cover;
    background-position: center, center, center, center;
    background-repeat: repeat, repeat, no-repeat, no-repeat;
    pointer-events: none;
    z-index: 0;
  }

  /* Header */
  .dms-header {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 32px;
    border-bottom: 1px solid rgba(34, 197, 94, 0.2);
    background: rgba(10,22,40,0.9);
    z-index: 10;
    backdrop-filter: blur(10px);
  }

  .dms-back {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: rgba(34, 197, 94, 0.7);
    cursor: pointer;
    border: 1px solid rgba(34, 197, 94, 0.2);
    padding: 6px 14px;
    border-radius: 6px;
    transition: all 0.18s;
    text-decoration: none;
  }

  .dms-back:hover {
    color: #22c55e;
    border-color: rgba(34, 197, 94, 0.5);
    background: rgba(34, 197, 94, 0.06);
  }

  .dms-back svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .dms-htitle {
    font-family: 'Rajdhani', sans-serif;
    font-size: 18px;
    font-weight: 700;
    color: #e8eaf0;
    letter-spacing: 1px;
  }
  .dms-htitle span { color: #22c55e; }

  .dms-hright { font-size: 12px; color: rgba(200,210,230,0.6); display: flex; align-items: center;}
  
  .dms-dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    background: #22c55e;
    border-radius: 50%;
    margin-right: 8px;
    animation: blink 2s infinite;
  }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

  /* Main Layout */
  .dms-main {
    position: relative;
    z-index: 10;
    padding: 32px 32px 60px;
    max-width: 1300px;
    margin: 0 auto;
  }

  .dms-hero { text-align: center; margin-bottom: 32px; }
  .dms-hero h1 { font-family: 'Rajdhani', sans-serif; font-size: 32px; font-weight: 700; color: #fff; letter-spacing: 1.5px; text-transform: uppercase; }
  .dms-hero h1 span { color: #22c55e; }
  .dms-hero p { font-size: 13px; color: rgba(200,210,230,0.5); margin-top: 8px; }

  /* Selection Tabs */
  .dms-tabs {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 40px;
  }

  .dms-tab {
    background: rgba(255,255,255,0.02);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    padding: 16px;
    cursor: pointer;
    text-align: center;
    transition: all 0.2s;
  }

  .dms-tab:hover { background: rgba(255,255,255,0.05); }

  .dms-tab.active {
    background: rgba(34, 197, 94, 0.08);
    border-color: rgba(34, 197, 94, 0.5);
    box-shadow: 0 4px 15px rgba(34, 197, 94, 0.1);
  }

  .dms-tab-icon { margin-bottom: 8px; }
  .dms-tab-icon svg { width: 24px; height: 24px; stroke: rgba(255,255,255,0.4); fill: none; stroke-width: 1.5; transition: all 0.2s; }
  .dms-tab.active .dms-tab-icon svg { stroke: #22c55e; }

  .dms-tab-title { font-family: 'Rajdhani', sans-serif; font-size: 16px; font-weight: 600; color: rgba(255,255,255,0.6); text-transform: uppercase; letter-spacing: 1px; transition: color 0.2s; }
  .dms-tab.active .dms-tab-title { color: #22c55e; }

  /* View Area Header */
  .dms-view-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 1px solid rgba(34, 197, 94, 0.2);
  }

  .dms-view-title { font-family: 'Rajdhani', sans-serif; font-size: 24px; font-weight: 600; color: #fff; }
  .dms-view-desc { font-size: 13px; color: rgba(200,210,230,0.5); margin-top: 4px; }
  
  .dms-summary { display: flex; gap: 16px; font-size: 12px; font-weight: 500; font-family: 'Inter', sans-serif; }
  .dms-sum-badge { padding: 4px 12px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.2); color: #e8eaf0; }
  .dms-sum-badge span { margin-left: 6px; font-weight: 700; }
  .dms-sum-badge.bg-green span { color: #22c55e; }
  .dms-sum-badge.bg-red span { color: #ef4444; }

  /* Data Rack (Grid of Plants/Phases) */
  .dms-rack {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
  }

  .dms-node-group {
    background: rgba(10,22,40,0.7);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    padding: 16px;
  }

  .dms-group-header {
    font-family: 'Rajdhani', sans-serif;
    font-size: 16px;
    font-weight: 600;
    color: #FFBE00;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px dashed rgba(255,255,255,0.1);
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  /* Subgroup row styling (Used for grouping by Line) */
  .dms-subgroup {
    display: flex;
    align-items: center;
    gap: 8px;
    padding-bottom: 6px;
    margin-bottom: 8px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }

  .dms-subgroup:last-child {
    border-bottom: none;
    margin-bottom: 0;
    padding-bottom: 0;
  }

  .dms-subgroup-title {
    font-size: 12px;
    font-weight: 600;
    color: rgba(255,255,255,0.6);
    width: 35px;
    flex-shrink: 0;
  }

  /* High-Density Chip Layout for Pipelines */
  .dms-nodes {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    flex-grow: 1;
  }

  .dms-chip {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    padding: 4px 8px;
    border-radius: 4px;
    border: 1px solid;
    font-family: 'Inter', sans-serif;
  }

  .dms-chip.online {
    color: rgba(200,210,230,0.8);
    border-color: rgba(34, 197, 94, 0.2);
    background: rgba(34, 197, 94, 0.04);
  }

  .dms-chip.offline {
    color: #fff;
    border-color: #ef4444;
    background: rgba(239, 68, 68, 0.15);
    font-weight: 600;
    box-shadow: 0 0 10px rgba(239, 68, 68, 0.2);
  }

  .dms-chip-dot { width: 6px; height: 6px; border-radius: 50%; }
  .online .dms-chip-dot { background: #22c55e; }
  .offline .dms-chip-dot { background: #ef4444; box-shadow: 0 0 5px #ef4444; }

</style>
</head>
<body>

<div class="dms-page">
  <div class="dms-gridbg"></div>

  <header class="dms-header">
    <a href="hartalega_foresight_landing_page.html" class="dms-back">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      Main portal
    </a>
    <div class="dms-htitle">DMS <span>HEALTH</span></div>
    <div class="dms-hright"><span class="dms-dot"></span> Diagnostics Active</div>
  </header>

  <main class="dms-main">
    
    <div class="dms-hero">
      <h1>Data Pipeline <span>Diagnostics</span></h1>
      <p>Select a dashboard segment below to view the health of its underlying data extraction pipelines.</p>
    </div>

    <div class="dms-tabs">
      <div class="dms-tab active" onclick="loadView('compounding')" id="tab-compounding">
        <div class="dms-tab-icon"><svg viewBox="0 0 24 24"><path d="M9 3h6"/><path d="M10 3v6l-6.5 11h17l-6.5-11V3"/></svg></div>
        <div class="dms-tab-title">Compounding</div>
      </div>
      <div class="dms-tab" onclick="loadView('production')" id="tab-production">
        <div class="dms-tab-icon"><svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg></div>
        <div class="dms-tab-title">Production</div>
      </div>
      <div class="dms-tab" onclick="loadView('engineering_pp')" id="tab-engineering_pp">
        <div class="dms-tab-icon"><svg viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg></div>
        <div class="dms-tab-title">Eng Plant &amp; Process</div>
      </div>
      <div class="dms-tab" onclick="loadView('engineering_utility')" id="tab-engineering_utility">
        <div class="dms-tab-icon"><svg viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg></div>
        <div class="dms-tab-title">Engineering Utility</div>
      </div>
    </div>

    <div id="outputArea">
      <div class="dms-view-header">
        <div>
          <div class="dms-view-title" id="viewTitle">Loading...</div>
          <div class="dms-view-desc" id="viewDesc"></div>
        </div>
        <div class="dms-summary">
          <div class="dms-sum-badge">Total Pipelines <span id="sumTotal">0</span></div>
          <div class="dms-sum-badge bg-green">Online <span id="sumOnline">0</span></div>
          <div class="dms-sum-badge bg-red">Offline <span id="sumOffline">0</span></div>
        </div>
      </div>
      <div class="dms-rack" id="dataRack"></div>
    </div>

  </main>
</div>

<script>
/**
 * =========================================================================
 * DMS PIPELINE CONFIGURATION & DATA GENERATOR
 * =========================================================================
 */

// Helper to simulate data. 95% chance to be online.
const simStatus = () => Math.random() > 0.05 ? 'online' : 'offline';

// Standard Plant Line Layout
const lineRanges = [
  [1, 12], [13, 24], [25, 36], [37, 48], [49, 60],
  [61, 72], [73, 82], [83, 92], [93, 104]
];

const dmsConfig = {
  compounding: {
    title: "Compounding Pipelines",
    desc: "Monitoring CPD Connection Statuses across Plant 1 to Plant 9",
    generate: () => {
      let groups = [];
      for(let i=1; i<=9; i++) {
        groups.push({
          title: `Plant ${i}`,
          nodes: [
            { label: "ACCS", status: simStatus() },
            { label: "CAA", status: simStatus() }
          ]
        });
      }
      return groups;
    }
  },
  production: {
    title: "Production Pipelines",
    desc: "Gateway connection status for individual lines across all plants.",
    generate: () => {
      let groups = [];
      lineRanges.forEach((range, idx) => {
        let pNum = idx + 1;
        let nodes = [];
        for(let line = range[0]; line <= range[1]; line++) {
          nodes.push({ label: `L${line}`, status: simStatus() });
        }
        if(pNum === 8) nodes.push({ label: `L105 (RND)`, status: simStatus() });
        groups.push({ title: `Plant ${pNum}`, nodes: nodes });
      });
      return groups;
    }
  },
  engineering_pp: {
    title: "Engineering Plant & Process",
    desc: "Connection statuses for GSR/GSS, ASM, and Vision systems down to individual lines.",
    generate: () => {
      let groups = [];
      lineRanges.forEach((range, idx) => {
        let pNum = idx + 1;
        
        // Instead of flat nodes, we create subgroups for line segregation
        let subgroups = [];
        for(let line = range[0]; line <= range[1]; line++) {
          
          // Use GSR for P1-8, GSS for P9
          let gsrLabel = (pNum === 9) ? "GSS" : "GSR";
          
          subgroups.push({
            title: `L${line}`,
            nodes: [
              { label: gsrLabel, status: simStatus() },
              { label: "ASM", status: simStatus() },
              { label: "Vision", status: simStatus() }
            ]
          });
        }
        groups.push({ title: `Plant ${pNum}`, subgroups: subgroups });
      });
      return groups;
    }
  },
  engineering_utility: {
    title: "Engineering Utility",
    desc: "Connection statuses for Boiler, Chiller, Compressor, Scrubber, RWTP, and WWTP.",
    generate: () => {
      let groups = [];
      const pipelines = ["Boiler", "Chiller", "Compressor", "Scrubber", "RWTP", "WWTP"];
      const phases = [
        { name: "Phase 1", desc: "Plant 1 & Plant 2" },
        { name: "Phase 2", desc: "Plant 3 & Plant 4" },
        { name: "Phase 3", desc: "Plant 5 & Plant 6" },
        { name: "Phase 4", desc: "Plant 7" },
        { name: "Phase 5", desc: "Plant 8 & Plant 9" }
      ];
      
      phases.forEach(ph => {
        let nodes = pipelines.map(p => ({
          label: p,
          status: simStatus()
        }));
        groups.push({ 
          // Appends the specific plant descriptions next to the Phase title
          title: `${ph.name} <span style="font-size:11px; color:rgba(255,255,255,0.4); margin-left:8px; text-transform:none;">${ph.desc}</span>`, 
          nodes: nodes 
        });
      });
      return groups;
    }
  }
};

/**
 * =========================================================================
 * UI RENDERER LOGIC
 * =========================================================================
 */
function loadView(category) {
  // Update Tab States
  document.querySelectorAll('.dms-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-' + category).classList.add('active');

  const conf = dmsConfig[category];
  document.getElementById('viewTitle').innerText = conf.title;
  document.getElementById('viewDesc').innerText = conf.desc;

  const data = conf.generate();
  const rack = document.getElementById('dataRack');
  rack.innerHTML = '';

  let total = 0;
  let online = 0;
  let offline = 0;

  // Render Grid
  data.forEach(group => {
    let groupHtml = `<div class="dms-node-group"><div class="dms-group-header">${group.title}</div>`;
    
    // Check if the group uses Line-based Subgroups (Eng P&P) or flat Nodes
    if (group.subgroups) {
      group.subgroups.forEach(sub => {
        groupHtml += `<div class="dms-subgroup">
                        <div class="dms-subgroup-title">${sub.title}</div>
                        <div class="dms-nodes">`;
        
        sub.nodes.forEach(node => {
          total++;
          if(node.status === 'online') online++; else offline++;
          groupHtml += `<div class="dms-chip ${node.status}" title="Status: ${node.status.toUpperCase()}">
                          <div class="dms-chip-dot"></div>${node.label}
                        </div>`;
        });
        groupHtml += `</div></div>`; // Close nodes & subgroup
      });
    } else {
      // Flat nodes layout
      groupHtml += `<div class="dms-nodes">`;
      group.nodes.forEach(node => {
        total++;
        if(node.status === 'online') online++; else offline++;
        groupHtml += `<div class="dms-chip ${node.status}" title="Status: ${node.status.toUpperCase()}">
                        <div class="dms-chip-dot"></div>${node.label}
                      </div>`;
      });
      groupHtml += `</div>`; // Close nodes
    }

    groupHtml += `</div>`; // Close node-group
    rack.insertAdjacentHTML('beforeend', groupHtml);
  });

  // Update Summary Badges
  document.getElementById('sumTotal').innerText = total;
  document.getElementById('sumOnline').innerText = online;
  document.getElementById('sumOffline').innerText = offline;
}

// Initialize default view
window.onload = () => loadView('compounding');

</script>
</body>
</html>
