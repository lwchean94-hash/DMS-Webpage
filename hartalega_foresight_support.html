<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hartalega Foresight - Support & Requests</title>
<link rel="icon" type="image/png" href="Hartalega_Foresight_Logo.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  /* Set background on HTML to prevent white flashes during scale */
  html {
    background: #0a1628;
    overflow-x: hidden;
  }

  /* BULLETPROOF 80% SCALE METHOD */
  body {
    font-family: 'Inter', sans-serif;
    color: #e8eaf0;
    margin: 0;
    padding: 0;
    overflow-x: hidden;
    width: 125%;
    min-height: 125vh;
    transform: scale(0.8);
    transform-origin: top left;
  }

  .s-gridbg {
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,190,0,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,190,0,0.03) 1px, transparent 1px),
      radial-gradient(circle at center, rgba(10,22,40,0.85) 0%, rgba(10,22,40,0.65) 100%),
      url('Foresight_Background.jpg'); 
    background-size: 48px 48px, 48px 48px, cover, cover;
    background-position: center, center, center, center;
    pointer-events: none;
    z-index: 0;
  }

  /* Header */
  .s-header {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 32px;
    border-bottom: 1px solid rgba(255,190,0,0.15);
    background: rgba(10,22,40,0.9);
    z-index: 10;
    backdrop-filter: blur(10px);
  }

  .s-back {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: rgba(255,190,0,0.7);
    cursor: pointer;
    border: 1px solid rgba(255,190,0,0.2);
    padding: 6px 14px;
    border-radius: 6px;
    transition: all 0.18s;
    text-decoration: none;
    text-transform: uppercase;
    font-weight: 600;
  }

  .s-back:hover {
    color: #FFBE00;
    border-color: rgba(255,190,0,0.5);
    background: rgba(255,190,0,0.06);
  }
  .s-back svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; }

  .s-htitle { font-family: 'Rajdhani', sans-serif; font-size: 18px; font-weight: 700; color: #fff; letter-spacing: 1px; text-transform: uppercase;}
  .s-htitle span { color: #FFBE00; }
  .s-hright { font-size: 12px; color: rgba(200,210,230,0.45); letter-spacing: 0.5px; }

  /* Main Layout */
  .s-main {
    position: relative;
    z-index: 10;
    padding: 40px 32px;
    max-width: 800px;
    margin: 0 auto;
  }

  .s-hero { text-align: center; margin-bottom: 32px; }
  .s-tag { display: inline-block; font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: #FFBE00; border: 1px solid rgba(255,190,0,0.25); padding: 4px 16px; border-radius: 20px; margin-bottom: 12px; background: rgba(255,190,0,0.05); }
  .s-hero h1 { font-family: 'Rajdhani', sans-serif; font-size: 32px; font-weight: 700; color: #fff; letter-spacing: 1px; text-transform: uppercase; }
  .s-hero p { font-size: 14px; color: rgba(200,210,230,0.5); margin-top: 10px; line-height: 1.6; }

  /* Form Card */
  .s-card {
    background: rgba(10,22,40,0.7);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 32px;
    backdrop-filter: blur(8px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }

  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 20px;
  }

  .form-group { display: flex; flex-direction: column; gap: 6px; }
  .form-group.full { grid-column: 1 / -1; }

  .form-label {
    font-size: 12px;
    color: rgba(200,210,230,0.7);
    letter-spacing: 0.5px;
    text-transform: uppercase;
    font-weight: 500;
  }

  .form-label span { color: #ef4444; } /* Red asterisk for required */

  .form-input, .form-select, .form-textarea {
    background: rgba(0,0,0,0.4);
    border: 1px solid rgba(255,255,255,0.15);
    color: #e8eaf0;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    padding: 10px 14px;
    border-radius: 6px;
    outline: none;
    transition: all 0.2s;
  }

  .form-input:focus, .form-select:focus, .form-textarea:focus {
    border-color: #FFBE00;
    background: rgba(255,190,0,0.02);
  }

  .form-select option { background: #0a1628; color: #fff; }
  .form-textarea { resize: vertical; min-height: 120px; line-height: 1.5; }

  .submit-row {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 16px;
    margin-top: 10px;
    padding-top: 20px;
    border-top: 1px solid rgba(255,255,255,0.05);
  }

  .btn-submit {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #FFBE00;
    color: #0a1628;
    border: none;
    padding: 10px 24px;
    border-radius: 6px;
    font-family: 'Rajdhani', sans-serif;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 1px;
    transition: all 0.2s;
  }

  .btn-submit:hover { background: #ffd040; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(255,190,0,0.3); }
  .btn-submit:disabled { opacity: 0.7; cursor: not-allowed; transform: none; box-shadow: none; }
  .btn-submit svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; }

  /* Toast Notification */
  .toast {
    position: fixed;
    bottom: -100px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(34, 197, 94, 0.15);
    border: 1px solid #22c55e;
    color: #22c55e;
    padding: 12px 24px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 10px;
    z-index: 1000;
    transition: bottom 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    backdrop-filter: blur(8px);
  }
  .toast.show { bottom: 40px; }
  .toast svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; }

</style>
</head>
<body>

<div class="s-gridbg"></div>

<header class="s-header">
  <a href="index.html" class="s-back">
    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    Main Portal
  </a>
  <div class="s-htitle">Foresight <span>Support</span></div>
  <div class="s-hright">Internal Request System</div>
</header>

<main class="s-main">
  <div class="s-hero">
    <div class="s-tag">Help Desk</div>
    <h1>System Request Portal</h1>
    <p>Use this form to request dashboard access, suggest new features, or report system anomalies. Submissions are sent directly to the engineering team.</p>
  </div>

  <div class="s-card">
    <form id="requestForm">
      
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">Requestor Name <span>*</span></label>
          <input type="text" class="form-input" id="reqName" placeholder="e.g. Ali" required>
        </div>

        <div class="form-group">
          <label class="form-label">Department <span>*</span></label>
          <select class="form-select" id="reqDept" required>
            <option value="" disabled selected>— Select Department —</option>
            <option value="CDD">CDD</option>
            <option value="CNI">CNI</option>
            <option value="CRC">CRC</option>
            <option value="ENG">ENG</option>
            <option value="FAC">FAC</option>
            <option value="FDD">FDD</option>
            <option value="FIN">FIN</option>
            <option value="GAD">GAD</option>
            <option value="GRC">GRC</option>
            <option value="HMR">HMR</option>
            <option value="HSE">HSE</option>
            <option value="IAD">IAD</option>
            <option value="MGS">MGS</option>
            <option value="MIS">MIS</option>
            <option value="OEX">OEX</option>
            <option value="PNS">PNS</option>
            <option value="PRD">PRD</option>
            <option value="PROC">PROC</option>
            <option value="PRT">PRT</option>
            <option value="PTD">PTD</option>
            <option value="QAS">QAS</option>
            <option value="RND">RND</option>
            <option value="SCM">SCM</option>
            <option value="SNM">SNM</option>
            <option value="WHS">WHS</option>
          </select>
        </div>

        <div class="form-group full">
          <label class="form-label">Request Type <span>*</span></label>
          <select class="form-select" id="reqType" required>
            <option value="" disabled selected>— Select Type —</option>
            <option value="Feature Request">New Feature Request</option>
            <option value="Bug / Error Report">Bug / Error Report</option>
            <option value="Dashboard Access">Dashboard Access Request</option>
            <option value="Data Inquiry">Data / Telemetry Inquiry</option>
            <option value="General Feedback">General Feedback</option>
          </select>
        </div>

        <div class="form-group full">
          <label class="form-label">Request Details <span>*</span></label>
          <textarea class="form-textarea" id="reqDetails" placeholder="Please provide specific details, plant/line numbers, or exact errors encountered..." required></textarea>
        </div>
      </div>

      <div class="submit-row">
        <button type="submit" class="btn-submit" id="submitBtn">
          Submit Request
          <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>

    </form>
  </div>
</main>

<div class="toast" id="successToast">
  <svg viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
  Request submitted successfully!
</div>

<script>
  // Paste your Google Script URL inside the quotes below
  const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwSUsSFlcBHXGry5XxZQNd3Dt1vYJ-u5LmqM7Y4Gsjh5s8zIS7nLs00QTfornvG4WqTQw/exec";

  document.getElementById('requestForm').addEventListener('submit', function(e) {
    e.preventDefault(); // Prevent page reload
    
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.innerHTML = 'Sending...';

    // Capture the data
    const requestData = {
      timestamp: new Date().toLocaleString('en-GB'),
      name: document.getElementById('reqName').value,
      department: document.getElementById('reqDept').value,
      type: document.getElementById('reqType').value,
      details: document.getElementById('reqDetails').value,
      status: "Pending"
    };

    // Send data to Google Sheets using "no-cors" mode
    fetch(GOOGLE_SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors', // <--- THIS BYPASSES THE SECURITY BLOCK
      headers: {
        'Content-Type': 'text/plain;charset=utf-8'
      },
      body: JSON.stringify(requestData)
    })
    .then(() => {
      // With no-cors, the response is hidden, so we assume success here.
      
      // 1. Show Success Toast
      const toast = document.getElementById('successToast');
      toast.classList.add('show');
      
      // 2. Hide Toast after 3.5 seconds
      setTimeout(() => { toast.classList.remove('show'); }, 3500);

      // 3. Reset Form and Button
      document.getElementById('requestForm').reset();
      btn.disabled = false;
      btn.innerHTML = 'Submit Request <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>';
    })
    .catch(error => {
      console.error('Fetch Error:', error);
      alert("Network error. Please check your connection and try again.");
      btn.disabled = false;
      btn.innerHTML = 'Submit Request';
    });
  });
</script>

</body>
</html>
