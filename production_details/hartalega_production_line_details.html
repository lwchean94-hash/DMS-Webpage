<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hartalega Foresight - Process Detailed Dashboard</title>
<link rel="icon" type="image/png" href="../Hartalega_Foresight_Logo.png?v=2">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    zoom: 80%;
    background: #0a1628;
    overflow-x: hidden;
  }
  
  .l-page {
    font-family: 'Inter', sans-serif;
    background: #0a1628;
    min-height: 100vh;
    color: #e8eaf0;
    position: relative;
    overflow-x: hidden;
  }

  .l-gridbg {
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,190,0,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,190,0,0.03) 1px, transparent 1px);
    background-size: 48px 48px;
    pointer-events: none;
    z-index: 0;
  }

  /* Main Top Header */
  .l-top-banner {
    position: relative;
    z-index: 20;
    text-align: center;
    padding: 24px 32px 16px;
    background: linear-gradient(180deg, rgba(10,22,40,0.95) 0%, rgba(10,22,40,0.8) 100%);
    border-bottom: 1px solid rgba(255,190,0,0.05);
  }

  .l-main-title {
    font-family: 'Rajdhani', sans-serif;
    font-size: 34px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 2px;
    text-transform: uppercase;
    text-shadow: 0 0 20px rgba(255,190,0,0.1);
  }
  .l-main-title span { color: #FFBE00; }

  /* Control Bar (Moved below Header) */
  .l-control-bar {
    position: relative;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 32px;
    background: rgba(10,22,40,0.9);
    border-bottom: 1px solid rgba(255,190,0,0.15);
    backdrop-filter: blur(10px);
  }

  .l-header-left, .l-header-right { display: flex; align-items: center; gap: 24px; }

  .l-back {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: rgba(255,190,0,0.7);
    cursor: pointer;
    border: 1px solid rgba(255,190,0,0.2);
    padding: 6px 14px;
    border-radius: 6px;
    transition: all 0.18s;
    text-decoration: none;
  }
  .l-back:hover { color: #FFBE00; border-color: rgba(255,190,0,0.5); background: rgba(255,190,0,0.06); }
  .l-back svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; }

  /* Dropdowns */
  .l-selector-group {
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(0,0,0,0.2);
    padding: 4px 12px;
    border-radius: 8px;
    border: 1px solid rgba(255,190,0,0.1);
  }

  .l-select {
    background: transparent;
    color: #FFBE00;
    font-family: 'Rajdhani', sans-serif;
    font-size: 18px;
    font-weight: 700;
    border: none;
    outline: none;
    cursor: pointer;
    padding: 4px;
  }
  .l-select option { background: #0a1628; color: #e8eaf0; font-family: 'Inter', sans-serif; font-size: 14px;}

  .l-divider { color: rgba(200,210,230,0.3); }

  .l-date-selector {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: rgba(200,210,230,0.7);
  }

  .l-date-select {
    background: rgba(255,190,0,0.05);
    color: #FFBE00;
    border: 1px solid rgba(255,190,0,0.2);
    padding: 6px 12px;
    border-radius: 6px;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 500;
    outline: none;
    cursor: pointer;
  }
  /* FIXED: Ensure options don't blend into the background */
  .l-date-select option {
    background: #0a1628;
    color: #e8eaf0;
  }

  /* Main Content */
  .l-main {
    position: relative;
    z-index: 10;
    padding: 24px 32px 48px;
    max-width: 1600px;
    margin: 0 auto;
  }

  /* Product Banner */
  .l-product-banner {
    background: linear-gradient(90deg, rgba(34,197,94,0.1), transparent);
    border: 1px solid rgba(34,197,94,0.2);
    border-left: 4px solid #22c55e;
    padding: 16px 24px;
    border-radius: 8px;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .l-product-info h3 { font-family: 'Rajdhani', sans-serif; font-size: 14px; color: rgba(200,210,230,0.6); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px;}
  .l-product-info h1 { font-family: 'Inter', sans-serif; font-size: 24px; font-weight: 600; color: #fff;}
  .l-product-status { font-size: 12px; color: #22c55e; display: flex; align-items: center; gap: 6px;}
  .l-product-status span { display: inline-block; width: 8px; height: 8px; background: #22c55e; border-radius: 50%; box-shadow: 0 0 8px #22c55e;}

  /* Tabs */
  .l-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 24px;
    border-bottom: 1px solid rgba(255,190,0,0.1);
    padding-bottom: 8px;
    overflow-x: auto;
  }
  .l-tab {
    padding: 8px 16px;
    background: transparent;
    border: 1px solid transparent;
    color: rgba(200,210,230,0.5);
    font-family: 'Rajdhani', sans-serif;
    font-size: 15px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .l-tab:hover { color: #FFBE00; background: rgba(255,190,0,0.05); }
  .l-tab.active {
    color: #FFBE00;
    background: rgba(255,190,0,0.1);
    border-color: rgba(255,190,0,0.3);
  }

  .l-panel { display: none; }
  .l-panel.active { display: block; }

  /* Accordion Tanks */
  .l-tank-group {
    background: rgba(10,22,40,0.5);
    border: 1px solid rgba(255,190,0,0.15);
    border-radius: 8px;
    margin-bottom: 20px;
    overflow: hidden;
  }
  .l-tank-header {
    background: rgba(255,190,0,0.05);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    border-bottom: 1px solid transparent;
    transition: all 0.2s;
  }
  .l-tank-header:hover { background: rgba(255,190,0,0.1); }
  .l-tank-title {
    font-family: 'Rajdhani', sans-serif;
    font-size: 20px;
    font-weight: 600;
    color: #e8eaf0;
    letter-spacing: 1px;
  }
  .l-tank-icon {
    width: 24px;
    height: 24px;
    stroke: #FFBE00;
    fill: none;
    stroke-width: 2;
    transition: transform 0.3s ease;
  }
  .l-tank-content {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
    padding: 24px;
  }
  .l-tank-content.collapsed { display: none; }
  .l-tank-header.collapsed { border-bottom-color: transparent; }

  /* Charts */
  .l-chart-card {
    background: rgba(0,0,0,0.2);
    border: 1px solid rgba(255,190,0,0.1);
    border-radius: 8px;
    padding: 16px;
  }
  .l-chart-title {
    font-size: 13px;
    font-weight: 500;
    color: rgba(200,210,230,0.7);
    margin-bottom: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .l-chart-title::before { content:''; display:block; width:12px; height:3px; background:#FFBE00; border-radius:2px;}
  .l-chart-wrapper {
    position: relative;
    height: 220px;
    width: 100%;
  }

</style>
</head>
<body>

<div class="l-page">
  <div class="l-gridbg"></div>

  <div class="l-top-banner">
    <h1 class="l-main-title">Production <span>Detailed</span> Dashboard</h1>
  </div>

  <header class="l-control-bar">
    <div class="l-header-left">
      <a href="../hartalega_production_landing.html" class="l-back">
        <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
        Overview
      </a>
      
      <div class="l-selector-group">
        <select class="l-select" id="plantSelect" onchange="handleNavigationChange()"></select>
        <span class="l-divider">/</span>
        <select class="l-select" id="lineSelect" onchange="handleNavigationChange()"></select>
      </div>
    </div>
    
    <div class="l-header-right">
      <div class="l-date-selector">
        <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" fill="none" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        <select class="l-date-select" id="durationSelect" onchange="updateChartsTimeframe()">
          <option value="6">Last 6 Hours</option>
          <option value="12">Last 12 Hours</option>
          <option value="24" selected>Last 24 Hours</option>
          <option value="168">Last 7 Days</option>
        </select>
      </div>
    </div>
  </header>

  <main class="l-main">
    
    <div class="l-product-banner">
      <div class="l-product-info">
        <h3>Current Running Product</h3>
        <h1 id="productDisplay">Loading Product...</h1>
      </div>
      <div class="l-product-status">
        <span></span> Live Telemetry Active
      </div>
    </div>

    <div class="l-tabs" id="tabsContainer">
      <button class="l-tab active" onclick="switchTab('cleaning')">Cleaning Area</button>
      <button class="l-tab" onclick="switchTab('coagulant')">Coagulant & Latex</button>
      <button class="l-tab" onclick="switchTab('oven')">Drying & Curing Oven</button>
      <button class="l-tab" onclick="switchTab('leaching')">Leaching & Beading</button>
      <button class="l-tab" onclick="switchTab('postcuring')">Post-Curing</button>
      <button class="l-tab" onclick="switchTab('postprocess')">Post-Process</button>
    </div>

    <div id="panel-cleaning" class="l-panel active">
      <div id="cleaningChartsContainer"></div>
    </div>

    <div id="panel-coagulant" class="l-panel">
      <div id="coagulantChartsContainer"></div>
    </div>

    <div id="panel-oven" class="l-panel"><p style="color:rgba(200,210,230,0.5); text-align:center; padding:40px;">No sensors integrated yet.</p></div>
    <div id="panel-leaching" class="l-panel"><p style="color:rgba(200,210,230,0.5); text-align:center; padding:40px;">No sensors integrated yet.</p></div>
    <div id="panel-postcuring" class="l-panel"><p style="color:rgba(200,210,230,0.5); text-align:center; padding:40px;">No sensors integrated yet.</p></div>
    <div id="panel-postprocess" class="l-panel"><p style="color:rgba(200,210,230,0.5); text-align:center; padding:40px;">No sensors integrated yet.</p></div>

  </main>
</div>

<script>
// --- 1. PLANT & LINE NAVIGATION LOGIC ---
const config = { plants: 9, linesPerPlant: 12 };

function initSelectors() {
  const pSelect = document.getElementById('plantSelect');
  for(let i=1; i<=config.plants; i++) {
    pSelect.options.add(new Option(`PLANT ${i}`, i));
  }
  
  const hash = window.location.hash;
  const match = hash.match(/#P(\d+)L(\d+)/);
  let pNum = 1, lNum = 1;
  if(match) { pNum = parseInt(match[1]); lNum = parseInt(match[2]); }
  
  pSelect.value = pNum;
  populateLines(pNum, lNum);
  document.title = `Hartalega Foresight - P${pNum} L${lNum} Trends`;
}

function populateLines(plantNum, selectLine) {
  const lSelect = document.getElementById('lineSelect');
  lSelect.innerHTML = '';
  const start = ((plantNum - 1) * config.linesPerPlant) + 1;
  const end = start + config.linesPerPlant - 1;
  for(let i=start; i<=end; i++) lSelect.options.add(new Option(`LINE ${i}`, i));
  if(plantNum == 8) lSelect.options.add(new Option(`LINE 105 (RND)`, 105));
  if(selectLine) lSelect.value = selectLine;
}

function handleNavigationChange() {
  const pSelect = document.getElementById('plantSelect');
  const lSelect = document.getElementById('lineSelect');
  if(event.target.id === 'plantSelect') populateLines(pSelect.value);
  window.history.pushState(null, null, `#P${pSelect.value}L${lSelect.value}`);
  document.title = `Hartalega Foresight - P${pSelect.value} L${lSelect.value} Trends`;
  fetchProduct();
  renderAllCharts();
}

// --- 2. PRODUCT FETCH LOGIC ---
async function fetchProduct() {
  const display = document.getElementById('productDisplay');
  try {
    const response = await fetch('../resource/product_masterlist.txt');
    if (!response.ok) throw new Error('File not found');
    const text = await response.text();
    const lines = text.split('\n').filter(line => line.trim() !== '');
    display.innerText = lines.length > 0 ? lines[Math.floor(Math.random() * lines.length)] : "Nitrile Examination Glove (3.5g)";
  } catch (error) {
    const fallbacks = ["Nitrile Examination Glove (3.2g) - Cobalt Blue", "Latex Surgical Glove - Natural", "Nitrile Industrial Glove (4.5g)"];
    display.innerText = fallbacks[Math.floor(Math.random() * fallbacks.length)];
  }
}

// --- 3. TAB LOGIC ---
function switchTab(tabId) {
  document.querySelectorAll('.l-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.l-panel').forEach(p => p.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById(`panel-${tabId}`).classList.add('active');
}

// --- 4. ACCORDION LOGIC ---
function toggleTank(element) {
  const content = element.nextElementSibling;
  const icon = element.querySelector('.l-tank-icon');
  if (content.classList.contains('collapsed')) {
    content.classList.remove('collapsed');
    element.classList.remove('collapsed');
    icon.style.transform = 'rotate(180deg)';
  } else {
    content.classList.add('collapsed');
    element.classList.add('collapsed');
    icon.style.transform = 'rotate(0deg)';
  }
}

// --- 5. CHARTS CONFIGURATION & RENDERING ---
const chartInstances = [];

// Raw parameter lists
const processData = {
  cleaning: {
    "Acid Tank": ["CAA Acid Flow Rate (L/hr)", "Acid Strength (%)", "Temp (°C)"],
    "Acid Neutralizer Tank": ["Raw Water Flow Rate (L/hr)", "NaOH Flow Rate (L/hr)", "Alkali Strength (%)", "Temp (°C)"],
    "Acid Shower": ["Raw Water Flow Rate (L/hr)"],
    "Alkaline Tank": ["Raw Water Flow Rate (L/hr)", "CAA Alkali Flow Rate (L/hr)", "Alkali Strength (%)", "Temp (°C)"],
    "Hot Bath": ["Raw Water Flow Rate (L/hr)", "Temperature (°C)"],
    "Cleaning Brush": ["Raw Water Flow Rate (L/hr)", "Status (On/Off)"],
    "Hot Rinse": ["Temperature (°C)", "Status (On/Off)"],
    "Hot Water": ["Temperature (°C)", "Hot Water Flow Rate (L/hr)", "pH"],
    "Hot Water Blower": ["Status (On/Off)"]
  },
  coagulant: {
    "Coagulant Tank": ["Temperature (°C)", "Coagulant Level (mm)", "Coagulant pH", "CN Strength (%)", "PFCA Concentration (%)", "Pump Speed (Hz)", "Stirrer Speed (Hz)"],
    "Latex Tank": ["Temperature (°C)", "Latex Level (mm)", "Latex pH", "TSC (%)", "Stirrer Speed (Hz)"]
  }
};

const chartColors = ['#FFBE00', '#22c55e', '#3b82f6', '#f43f5e', '#a855f7', '#06b6d4'];

// Helper to determine group name & data ranges based on units
function getUnitInfo(paramName) {
  if (paramName.includes('(L/hr)')) return { unit: "Flow Rate (L/hr)", min: 1200, max: 2500, step: false };
  if (paramName.includes('(%)')) return { unit: "Concentration (%)", min: 1, max: 15, step: false };
  if (paramName.includes('(°C)') || paramName.includes('Temp')) return { unit: "Temperature (°C)", min: 45, max: 80, step: false };
  if (paramName.includes('pH')) return { unit: "pH Level", min: 4, max: 10, step: false };
  if (paramName.includes('(mm)')) return { unit: "Tank Level (mm)", min: 600, max: 950, step: false };
  if (paramName.includes('(Hz)')) return { unit: "Motor Speed (Hz)", min: 30, max: 60, step: false };
  if (paramName.includes('(On/Off)')) return { unit: "Equipment Status", min: 0, max: 1, step: true };
  return { unit: "Measurement", min: 10, max: 100, step: false };
}

function generateMockData(hours, count, min, max, isStep) {
  const data = [], labels = [];
  const now = new Date();
  for(let i=count; i>=0; i--) {
    let d = new Date(now.getTime() - (i * (hours/count) * 60 * 60 * 1000));
    labels.push(d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}));
    if (isStep) {
      data.push(Math.random() > 0.15 ? 1 : 0); // Mostly ON
    } else {
      let base = min + (Math.random() * (max - min));
      data.push(base);
    }
  }
  return { labels, data };
}

function buildChartsForSection(sectionKey, containerId) {
  const container = document.getElementById(containerId);
  container.innerHTML = '';
  const sections = processData[sectionKey];
  const hours = parseInt(document.getElementById('durationSelect').value);
  const dataPoints = hours > 24 ? 40 : 20; 

  Chart.defaults.color = 'rgba(200,210,230,0.6)';
  Chart.defaults.font.family = 'Inter';

  let chartIndex = 0;

  Object.keys(sections).forEach((tankName) => {
    const allParams = sections[tankName];
    
    // Group parameters by their type/unit
    const groupedParams = {};
    allParams.forEach(param => {
      const info = getUnitInfo(param);
      if(!groupedParams[info.unit]) groupedParams[info.unit] = { info: info, params: [] };
      groupedParams[info.unit].params.push(param);
    });

    // Create Tank Accordion HTML
    const tankDiv = document.createElement('div');
    tankDiv.className = 'l-tank-group';
    
    // Accordion Header
    const headerHtml = `
      <div class="l-tank-header" onclick="toggleTank(this)">
        <div class="l-tank-title">${tankName}</div>
        <svg class="l-tank-icon" viewBox="0 0 24 24" style="transform: rotate(180deg);"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
      <div class="l-tank-content"></div>
    `;
    tankDiv.innerHTML = headerHtml;
    const contentDiv = tankDiv.querySelector('.l-tank-content');

    // Create Charts for each Grouped Unit inside the tank
    Object.keys(groupedParams).forEach((unitKey) => {
      const groupData = groupedParams[unitKey];
      
      const chartWrapper = document.createElement('div');
      chartWrapper.className = 'l-chart-card';
      chartWrapper.innerHTML = `
        <div class="l-chart-title">${unitKey}</div>
        <div class="l-chart-wrapper"><canvas id="chart-${chartIndex}"></canvas></div>
      `;
      contentDiv.appendChild(chartWrapper);

      const datasets = [];
      let commonLabels = [];

      groupData.params.forEach((paramName, pIdx) => {
        const mock = generateMockData(hours, dataPoints, groupData.info.min, groupData.info.max, groupData.info.step);
        if(pIdx === 0) commonLabels = mock.labels;
        
        datasets.push({
          label: paramName.replace(/\s*\(.*?\)\s*/g, ''), // Clean name for legend
          data: mock.data,
          borderColor: chartColors[pIdx % chartColors.length],
          backgroundColor: chartColors[pIdx % chartColors.length] + '20',
          borderWidth: 2,
          pointRadius: 0,
          tension: groupData.info.step ? 0 : 0.4,
          stepped: groupData.info.step ? true : false,
          fill: groupData.info.step ? true : false // Fill under status charts for visibility
        });
      });

      // We use a timeout to ensure the canvas is in the DOM before rendering
      const currentChartIndex = chartIndex;
      setTimeout(() => {
        const ctx = document.getElementById(`chart-${currentChartIndex}`).getContext('2d');
        const newChart = new Chart(ctx, {
          type: 'line',
          data: { labels: commonLabels, datasets: datasets },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            plugins: {
              legend: { position: 'bottom', labels: { boxWidth: 10, padding: 10, font: { size: 11 } } },
              tooltip: { backgroundColor: 'rgba(10,22,40,0.9)', titleFont: { family: 'Rajdhani', size: 14 }, borderColor: 'rgba(255,190,0,0.3)', borderWidth: 1 }
            },
            scales: {
              y: { 
                grid: { color: 'rgba(255,255,255,0.05)' }, 
                beginAtZero: groupData.info.step,
                max: groupData.info.step ? 1.2 : undefined,
                ticks: { stepSize: groupData.info.step ? 1 : undefined }
              },
              x: { grid: { display: false } }
            }
          }
        });
        chartInstances.push(newChart);
      }, 0);

      chartIndex++;
    });

    container.appendChild(tankDiv);
  });
}

function renderAllCharts() {
  chartInstances.forEach(chart => chart.destroy());
  chartInstances.length = 0;
  buildChartsForSection('cleaning', 'cleaningChartsContainer');
  buildChartsForSection('coagulant', 'coagulantChartsContainer');
}

function updateChartsTimeframe() { renderAllCharts(); }

window.onload = () => {
  initSelectors();
  fetchProduct();
  renderAllCharts();
};
</script>
</body>
</html>
