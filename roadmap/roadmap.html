<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DMS Development Roadmap</title>
    <link rel="stylesheet" href="./src/index.css">
    <link rel="icon" type="image/png" href="../Hartalega_Foresight_Logo.png?v=2">
  </head>
  <body class="hrt-page">
    <div class="hrt-grid-bg"></div>
    <div class="hrt-glow"></div>

    <header class="hrt-header">
      <button type="button" class="hrt-back" id="btn-back">
        <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
        Previous page
      </button>
      <div class="hrt-page-title">DMS Development <span>Roadmap</span></div>
      <div class="hrt-welcome">
        <div class="hrt-welcome-title"><span class="hrt-status-dot"></span>Interactive roadmap</div>
      </div>
    </header>

    <div class="main-content">
        <div class="toolbar">
            <div class="legend">
                <span class="legend-item"><span class="box live"></span> Developed, Live</span>
                <span class="legend-item"><span class="box demo"></span> Available in Demo</span>
                <span class="legend-item"><span class="box planned"></span> Planned / In-Progress</span>
                <span class="legend-item"><span class="box category"></span> Category</span>
            </div>
            <div class="actions">
                <a class="hrt-btn" href="../DMS_Roadmap.png" target="_blank" rel="noopener noreferrer">Roadmap Overview</a>
                <button id="btn-expand" class="hrt-btn">Expand All</button>
                <button id="btn-collapse" class="hrt-btn">Collapse All</button>
            </div>
        </div>
        
        <div id="tree-container">
            <div id="tree-wrapper">
                <ul id="tree-root" class="horizontal-list root-list"></ul>
            </div>
        </div>
    </div>
    <script src="./src/app.js" defer></script>
  </body>
</html>
